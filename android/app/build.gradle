apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    compileSdk 33
    namespace "com.blinkui"

    defaultConfig {
        applicationId    "com.blinkui.app"
        minSdk           24
        targetSdk        33
        versionCode      1
        versionName      "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        python {
            version "3.11"
            pip {
                install "blinkui"
            }
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    ndkVersion "27.0.12077973"

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
